[package]
name = "qpak-lib"
version = "1.0.0"
edition = "2024"
authors = [
    "cornmonger <cornmonger@cornmonger.fish>",
    "Cormac O'Brien <Cormac O'Brien <cormac@c-obrien.org>",
]
description = "An unofficial Quake PAK file modification library"
license = "MIT"
repository = "https://github.com/cornmonger/qpak"
keywords = ["quake", "pak", "file"]
categories = ["filesystem", "game-development", "parsing"]

[dependencies]
async-stream = "0.3.6"
async-walkdir = "2.1.0"
byteorder = "1.5.0"
dir-diff = "0.3.3"
log = "0.4.26"
map-ok = "1.0.0"
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["rt", "fs", "io-std", "io-util"] }
tokio-stream = "0.1.17"
walkdir = "2.5.0"

[dev-dependencies]
tokio = { version = "1.43.0", features = [
    "macros",
    "rt",
    "fs",
    "io-std",
    "io-util",
] }
