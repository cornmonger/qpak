[workspace]
resolver = "3"
members = [
    "packages/qpak-lib",
    "packages/qpak"
]

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/cornmonger/qpak"
keywords = ["quake", "pak", "file"]

[workspace.dependencies]
qpak-lib = { path = "packages/qpak-lib", version = "1" }

[profile.release]
strip = "symbols"
